<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#6EAAFF"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#182548"/>
      <stop offset="1" stop-color="#0A0C12"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- Pokerchip: concentrische ringen met blauwe gradient -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#chip)" stroke-width="30"/>
    <circle cx="256" cy="256" r="104" fill="none" stroke="url(#chip)" stroke-width="20"/>
    <circle cx="256" cy="256" r="42"  fill="url(#chip)"/>
    <!-- Randspots -->
    <g fill="#0A0C12">
      <circle cx="256" cy="86"  r="20"/>
      <circle cx="376" cy="136" r="20"/>
      <circle cx="426" cy="256" r="20"/>
      <circle cx="376" cy="376" r="20"/>
      <circle cx="256" cy="426" r="20"/>
      <circle cx="136" cy="376" r="20"/>
      <circle cx="86"  cy="256" r="20"/>
      <circle cx="136" cy="136" r="20"/>
    </g>
  </g>
</svg>
